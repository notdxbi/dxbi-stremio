name: Discord release post

# Posts each new release in the dx.bi Discord's #releases: version, what's new, downloads.
# Uses the repository secret DISCORD_RELEASE_WEBHOOK (the channel's webhook URL), and pings the
# release role given by the repository variable DISCORD_RELEASE_ROLE_ID (the role's ID; no ping if unset).
# Run it by hand to preview the post for a release without sending it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to preview (e.g. v2.15.2)
        required: true
      send:
        description: Actually post it to Discord
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The release is published before the apps are built and attached (10-30 minutes later): the
      # post waits until every download it links to is really there, so nobody clicks a dead link
      # or installs the old version. After two hours without them it gives up and posts nothing
      # (run this workflow by hand with "send" to post it then).
      - name: Wait for every download
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          want="dxbi-Setup-x64.exe dxbi-mac-arm64.dmg dxbi-mac-x64.dmg dxbi-linux-x86_64.AppImage dxbi-tv.apk dxbi.ipa dxbi-mobile.apk"
          for i in $(seq 1 120); do
            have=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.state == "uploaded") | .name] | join(" ")')
            missing=""
            for f in $want; do case " $have " in *" $f "*) ;; *) missing="$missing $f" ;; esac; done
            if [ -z "$missing" ]; then echo "all downloads are up"; exit 0; fi
            echo "waiting for:$missing"
            sleep 60
          done
          echo "Still missing after two hours:$missing"
          exit 1
      - name: Build and send the post
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          ROLE: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SEND: ${{ github.event_name == 'release' || inputs.send }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,name,body,url > release.json
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          jq --arg base "$base" --arg role "$ROLE" '
            # what is new: the notes without their Download list, kept within Discord limits
            (.body | split("\n## Download")[0] | gsub("\r"; "") | gsub("^\\s+|\\s+$"; "")) as $notes
            | {
                username: "dx.bi",
                # the release role is pinged (and only it: never @everyone or anyone named in the notes)
                content: (if $role != "" then "<@&\($role)>" else null end),
                allowed_mentions: { parse: [], roles: (if $role != "" then [$role] else [] end) },
                embeds: [{
                  title: ("dx.bi " + (.tagName | ltrimstr("v")) + " is out"),
                  url: .url,
                  color: 15010068,
                  description: (if ($notes | length) > 3800 then $notes[0:3800] + "…" else $notes end),
                  fields: [{
                    name: "Download",
                    value: ("[Windows](\($base)/dxbi-Setup-x64.exe) · [Mac (Apple chip)](\($base)/dxbi-mac-arm64.dmg) · [Mac (Intel)](\($base)/dxbi-mac-x64.dmg) · [Linux](\($base)/dxbi-linux-x86_64.AppImage) · [TV](\($base)/dxbi-tv.apk) · [iPhone](\($base)/dxbi.ipa) · [Android](\($base)/dxbi-mobile.apk)\nThe app updates itself on Windows and Linux.")
                  }],
                  footer: { text: "Full notes on GitHub" }
                }]
              }' release.json > post.json
          cat post.json
          if [ "$SEND" = "true" ]; then
            [ -n "$WEBHOOK" ] || { echo "DISCORD_RELEASE_WEBHOOK is not set"; exit 1; }
            curl -fsS -H "Content-Type: application/json" -d @post.json "$WEBHOOK"
            echo "posted"
          else
            echo "(preview only, nothing sent)"
          fi
