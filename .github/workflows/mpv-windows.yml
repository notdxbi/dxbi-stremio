name: mpv player (Windows)

# Builds the Windows app with mpv and plays a 10-bit HEVC + AC3 MKV through it (tools/mpv-test.mjs),
# checking on real screenshots of the desktop that the picture shows behind the dx.bi page.

on:
  push:
    paths:
      - "app/**"
      - "tools/mpv-test.mjs"
      - "tools/volume-test.mjs"
      - "tools/subtitle-font-test.mjs"
      - "tools/subtitle-style-test.mjs"
      - "tools/window-test.mjs"
      - "dxbi.plugin.js"
      - ".github/workflows/mpv-windows.yml"
  workflow_dispatch:

jobs:
  mpv:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the app with mpv
        shell: bash
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          bash scripts/fetch-mpv.sh
          npm run dist
          npx electron-builder --win --x64 --dir --publish never

      - name: Check custom subtitle fonts
        shell: bash
        run: node tools/subtitle-font-test.mjs "app/mpv/mpv.exe"

      - name: Check native subtitle styles
        shell: bash
        run: node tools/subtitle-style-test.mjs "app/mpv/mpv.exe"

      - name: Check transparent window controls
        shell: bash
        run: node tools/window-test.mjs

      - name: Check boosted volume and remembered playback
        shell: bash
        run: node tools/volume-test.mjs "app/mpv/mpv.exe"

      - name: Play through mpv
        shell: bash
        run: node tools/mpv-test.mjs "app/release-builds/win-unpacked/dx.bi.exe" mpv-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-windows
          path: mpv-shots
          if-no-files-found: ignore
