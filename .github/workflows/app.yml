name: Desktop app

# Publishing a release builds the dx.bi desktop app for every platform and attaches the files to
# that release, next to the plugin. Running it by hand just builds (files kept as artifacts).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, target: linux, arch: arm64 }
          - { os: windows-latest, target: win, arch: x64 }
          - { os: macos-15-intel, target: mac, arch: x64 }
          - { os: macos-latest, target: mac, arch: arm64 }
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Windows plays videos with mpv, bundled into the app (core/MpvShell.ts)
      - name: mpv
        if: matrix.target == 'win'
        shell: bash
        run: bash scripts/fetch-mpv.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: npm run build:${{ matrix.target }}:${{ matrix.arch }} -- --publish never
        env:
          # macOS builds aren't signed: don't go looking for a certificate
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: dxbi-app-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            app/release-builds/*.exe
            app/release-builds/*.dmg
            app/release-builds/*.AppImage
            app/release-builds/latest*.yml
            app/release-builds/*.blockmap
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        # each platform only makes some of these kinds of file; latest*.yml and the block maps are
        # what the app's self-updater reads (core/AutoUpdate.ts)
        # Both Mac builds write latest-mac.yml, and two uploads of it at once failed (2.15.8); the Mac
        # app doesn't update itself, so only the Intel build sends it
        run: |
          if [ "${{ matrix.target }}-${{ matrix.arch }}" = "mac-arm64" ]; then rm -f release-builds/latest-mac.yml; fi
          gh release upload "${{ github.event.release.tag_name }}" $(ls release-builds/*.exe release-builds/*.dmg release-builds/*.AppImage release-builds/latest*.yml release-builds/*.blockmap 2>/dev/null) --clobber
        env:
          GH_TOKEN: ${{ github.token }}
